name: NFS Server (Ganesha)
version: "1.2.1"
slug: nfs_ganesha
description: Expose Home Assistant folders via NFS using nfs-ganesha
url: https://github.com/sam-ward/nfs-ganesha-addon
startup: system
arch:
  - aarch64
  - amd64
init: false
map:
  - config:rw
  - ssl:rw
  - addons:rw
  - all_addon_configs:rw
  - backup:rw
  - share:rw
  - media:rw
host_network: true
# Read-only access to /network/info, to resolve authorized_ips "auto".
hassio_api: true
privileged:
  - DAC_READ_SEARCH
  - SYS_RESOURCE
options:
  authorized_ips:
    - auto
  export_folders:
    - share
    - media
    - backup
  log_level: WARN
schema:
  authorized_ips:
    - str
  export_folders:
    - match(config|ssl|addons|addon_configs|backup|share|media)
  log_level: list(NULL|FATAL|MAJ|CRIT|WARN|EVENT|INFO|DEBUG|MID_DEBUG|FULL_DEBUG)?
