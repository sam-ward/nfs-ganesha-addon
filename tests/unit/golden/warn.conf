###################################################
#     NFS-Ganesha Config Generated by Addon       #
###################################################

NFS_CORE_PARAM
{
    NFS_Port = 2049;
    NFS_Protocols = 4;
    Enable_NLM = false;
    Enable_RQUOTA = false;
    # Ganesha 6.x calls prctl(PR_SET_IO_FLUSHER), which needs SYS_RESOURCE
    # (granted in config.yaml). If a platform withholds it, start anyway.
    Allow_Set_Io_Flusher_Fail = true;
}

NFSv4
{
    Grace_Period = 60;
    # Use numeric IDs to avoid ID mapping issues
    Only_Numeric_Owners = true;
}

EXPORT_DEFAULTS
{
    Squash = All_Squash;
    Anonymous_Uid = 0;
    Anonymous_Gid = 0;
    # Re-read attributes on every access: Home Assistant and the Supervisor
    # change files directly, and the default 60 s cache hid those changes.
    Attr_Expiration_Time = 0;
}

NFS_KRB5
{
    Active_krb5 = false;
}

LOG {
    Default_Log_Level = WARN;
    COMPONENTS {
        TIRPC = FATAL;
        NFS_CB = FATAL;
        INIT = FATAL;
        DISPATCH = FATAL;
    }
}

EXPORT
{
    Export_Id = 10;
    Path = "/homeassistant";
    Pseudo = "/config";
    FSAL { Name = VFS; }
    Access_Type = None;
    CLIENT
    {
        Clients = 192.168.1.0/24;
        Protocols = 4;
        Access_Type = RW;
    }
}
