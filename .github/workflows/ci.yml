name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  # Weekly, to catch drift nobody committed: base image updates, Debian
  # package changes, the pinned Ganesha source leaving trixie-backports.
  # GitHub emails the repository owner when a scheduled run fails.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: HA app linter
        uses: frenck/action-app-linter@v2
        with: {path: ./nfs-ganesha}
      - run: make lint

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: make unit

  changes:
    # paths-filter needs a base to compare with, which only pull requests have.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      addon: ${{ steps.filter.outputs.addon }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            addon:
              - 'nfs-ganesha/**'
              - 'tests/**'
              - 'Makefile'
              - '.github/workflows/**'

  functional:
    needs: [changes]
    # Docs-only PRs skip the NFS tests; pushes and the weekly run always run
    # them. !cancelled() keeps this job from being skipped with `changes`
    # (skipped outside pull requests), and testing unless the filter answered
    # "false" means a failed filter runs the tests rather than skipping them.
    if: ${{ !cancelled() && needs.changes.outputs.addon != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, os: ubuntu-24.04}
          - {arch: aarch64, os: ubuntu-24.04-arm}
    name: functional (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Port 2049 is free
        run: "! ss -tln | grep -E ':2049\\b'"
      - run: make functional
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: addon-log-${{ matrix.arch }}
          path: .test-logs/addon.log
          if-no-files-found: ignore

  images:
    # The Supervisor pulls config.yaml's image at its version, so main must
    # never advertise a version whose images aren't published (and public).
    # Releases publish the images first (tag), then merge to main.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Images exist for config.yaml's version
        run: |
          image=$(sed -n 's/^image: *//p' nfs-ganesha/config.yaml)
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' nfs-ganesha/config.yaml)
          if [ -z "$image" ]; then
            echo "config.yaml has no image: the Supervisor builds the app on the device"
            exit 0
          fi
          for arch in amd64 aarch64; do
            ref="${image/\{arch\}/$arch}:$version"
            if ! docker manifest inspect "$ref" > /dev/null; then
              echo "::error::$ref isn't published (or isn't public)"
              exit 1
            fi
            echo "$ref is published"
          done
